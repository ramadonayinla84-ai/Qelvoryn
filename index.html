<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101a2a">
<title>Qelvoryn — Prototype 0.1</title>
<style>
  :root { color-scheme: dark; --panel: rgba(10,18,32,.82); --line: rgba(255,255,255,.18); }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#8bb7d9; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; touch-action:none; }
  #game { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  #topbar { position:fixed; top: max(10px, env(safe-area-inset-top)); left:10px; right:10px; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; pointer-events:none; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 12px; color:#fff; backdrop-filter:blur(10px); box-shadow:0 8px 28px #0002; }
  #brand { font-weight:800; letter-spacing:.08em; font-size:14px; }
  #subtitle { font-size:10px; opacity:.75; margin-top:3px; letter-spacing:.08em; }
  #stats { text-align:right; font-size:12px; line-height:1.6; }
  #hint { position:fixed; top:86px; left:50%; transform:translateX(-50%); max-width:calc(100% - 24px); text-align:center; font-size:12px; white-space:nowrap; }
  #controls { position:fixed; left:16px; bottom: max(22px, env(safe-area-inset-bottom)); width:142px; height:142px; border-radius:50%; background:rgba(8,16,28,.28); border:1px solid rgba(255,255,255,.24); touch-action:none; }
  #stick { position:absolute; width:58px; height:58px; border-radius:50%; left:41px; top:41px; background:rgba(255,255,255,.72); border:2px solid rgba(255,255,255,.8); box-shadow:0 4px 15px #0004; }
  #actions { position:fixed; right:15px; bottom:max(25px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; align-items:center; }
  .action { width:72px; height:72px; border-radius:50%; border:1px solid rgba(255,255,255,.5); color:#fff; background:rgba(10,18,32,.78); font-weight:700; font-size:12px; touch-action:manipulation; }
  .action:active { transform:scale(.96); background:#236b82; }
  #message { position:fixed; left:50%; bottom:190px; transform:translateX(-50%); max-width:calc(100% - 32px); text-align:center; font-size:13px; display:none; }
  #footer { position:fixed; bottom:8px; left:50%; transform:translateX(-50%); color:#fff; text-shadow:0 1px 5px #000; opacity:.75; font-size:10px; white-space:nowrap; pointer-events:none; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#101a2a; color:white; padding:24px; text-align:center; z-index:10; }
  #loading small { display:block; opacity:.7; margin-top:8px; line-height:1.5; }
  @media (min-width:800px) { #controls { width:160px;height:160px; } #stick {left:49px;top:49px;} }
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div><strong>QELVORYN</strong><small>Chargement du prototype 3D…<br>Une connexion Internet est nécessaire.</small></div></div>
<div id="topbar">
  <div class="panel"><div id="brand">QELVORYN</div><div id="subtitle">LIFE SIMULATION · PROTOTYPE 0.1</div></div>
  <div class="panel" id="stats">Portefeuille : <strong id="money">250 QV</strong><br>Quartier : <strong>Nova District</strong></div>
</div>
<div id="hint" class="panel">Explore le quartier et approche-toi du bâtiment bleu.</div>
<div id="controls" aria-label="Joystick de déplacement"><div id="stick"></div></div>
<div id="actions">
  <button class="action" id="interact">INTERAGIR</button>
  <button class="action" id="job">TRAVAIL<br>+50 QV</button>
</div>
<div id="message" class="panel"></div>
<div id="footer">Prototype de démonstration · Pas encore de multijoueur</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const loading = document.getElementById('loading');
const message = document.getElementById('message');
const moneyEl = document.getElementById('money');
const game = document.getElementById('game');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91c4e8);
scene.fog = new THREE.Fog(0x91c4e8, 30, 115);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 5, 9);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
game.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdff2ff, 0x64715c, 2.0));
const sun = new THREE.DirectionalLight(0xfff1d4, 2.2);
sun.position.set(-15, 25, 10); scene.add(sun);

const mat = (color, roughness=0.9) => new THREE.MeshStandardMaterial({color, roughness});
const grassMat = mat(0x62965a);
const roadMat = mat(0x343b45);
const sidewalkMat = mat(0xbab8ad);
const whiteMat = mat(0xf4f2e9);
const blueMat = mat(0x167dba);
const glassMat = new THREE.MeshStandardMaterial({color:0x7fc8e8, roughness:.22, metalness:.1});
const darkMat = mat(0x293442);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(180,180), grassMat);
ground.rotation.x=-Math.PI/2; ground.position.y=-.06; scene.add(ground);

function box(w,h,d,material,x,y,z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  m.position.set(x,y,z); scene.add(m); return m;
}
// Road and sidewalks
box(18,.08,110,roadMat,0,0,0);
box(2,.12,110,sidewalkMat,-10,0.02,0);
box(2,.12,110,sidewalkMat,10,0.02,0);
for(let z=-50; z<55; z+=7) {
  box(.18,.025,3.2,whiteMat,0,.06,z);
}
// buildings, doors and windows
const buildings = [];
function building(x,z,w,d,h,color,isJob=false) {
  const b = box(w,h,d,mat(color),x,h/2,z);
  box(w+0.18,.18,d+0.18,mat(0x303a49),x,h+.05,z);
  const rows = Math.max(1,Math.floor((h-1)/2.2));
  for(let r=0;r<rows;r++) {
    for(let c=0;c<Math.max(1,Math.floor(w/1.8));c++) {
      const wx=x-w/2+.9+c*1.8;
      box(.72,.85,.06,glassMat,wx,1.45+r*2.1,z-d/2-.04);
    }
  }
  if(isJob) {
    box(1.6,1.2,.08,blueMat,x,0.7,z-d/2-.1);
    buildings.push({x,z,w,d,object:b});
  }
}
building(-15,-13,8,9,9,0xd9c6a5);
building(15,-20,9,10,14,0xd0d8df);
building(-16,7,7,8,13,0xe1e3df);
building(15,8,8,9,8,0xc4b6a2);
building(-15,28,9,10,16,0xb5c8d3);
building(15,30,10,9,12,0xd9d2c4);
building(-16,-37,8,9,11,0xc1d4c5);
building(16,-42,10,8,17,0xd3c5b9);
building(0,-28,7,7,6,0x9cc3a6,true);

// simple stylized player avatar
const player = new THREE.Group(); scene.add(player);
const skin = mat(0x8b5638);
const shirt = mat(0x193c58);
const pants = mat(0x252d38);
const shoes = mat(0x15191e);
const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.34,.55,4,8),shirt); torso.position.y=1.25; player.add(torso);
const head = new THREE.Mesh(new THREE.SphereGeometry(.25,16,12),skin); head.position.y=1.95; player.add(head);
const hair = new THREE.Mesh(new THREE.SphereGeometry(.255,16,8,0,Math.PI*2,0,Math.PI*.55),mat(0x171614)); hair.position.y=2.02; player.add(hair);
const legL = new THREE.Mesh(new THREE.CapsuleGeometry(.12,.48,3,6),pants); legL.position.set(-.16,.55,0); player.add(legL);
const legR = legL.clone(); legR.position.x=.16; player.add(legR);
const armL = new THREE.Mesh(new THREE.CapsuleGeometry(.09,.45,3,6),skin); armL.position.set(-.42,1.25,0); armL.rotation.z=.15; player.add(armL);
const armR = armL.clone(); armR.position.x=.42; armR.rotation.z=-.15; player.add(armR);
const footL = new THREE.Mesh(new THREE.BoxGeometry(.18,.12,.3),shoes); footL.position.set(-.16,.13,-.04); player.add(footL);
const footR = footL.clone(); footR.position.x=.16; player.add(footR);
player.position.set(0,0,16);

// trees
function tree(x,z) {
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.5,7),mat(0x76513a)); trunk.position.set(x,.75,z); scene.add(trunk);
  const crown = new THREE.Mesh(new THREE.SphereGeometry(1.15,9,7),mat(0x367447)); crown.position.set(x,2.0,z); scene.add(crown);
}
for (let z=-46;z<50;z+=12) { tree(-12,z); tree(12,z+4); }

// parked cars, simplified
function car(x,z,color) {
  const g = new THREE.Group(); g.position.set(x,.15,z); scene.add(g);
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.7,.55,3.2),mat(color)); body.position.y=.45; g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3,.55,1.5),glassMat); cabin.position.set(0,.95,-.1); g.add(cabin);
  for(const wx of [-.88,.88]) for(const wz of [-1,1]) {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.14,10),darkMat);
    wheel.rotation.z=Math.PI/2; wheel.position.set(wx,.25,wz); g.add(wheel);
  }
}
car(-3,-8,0xc94343); car(3,12,0xe2e5e8); car(-3,27,0xdaa83b);

// simple skyline background
for(let i=0;i<22;i++) {
  const x=(i%2===0?-1:1)*(24+Math.random()*25);
  const z=-55+Math.random()*100;
  const h=8+Math.random()*25;
  box(5,h,5,mat([0x879aa8,0x9aabb4,0x7b8f9b][i%3]),x,h/2,z);
}

let money=250;
let vx=0, vz=0, moveX=0, moveY=0, walking=0;
let lastMsg=0;
function say(text) {
  message.textContent=text; message.style.display='block';
  lastMsg=performance.now()+3000;
}
function nearJob() {
  const dx=player.position.x-0, dz=player.position.z-(-28);
  return Math.hypot(dx,dz)<5;
}
document.getElementById('job').addEventListener('click',()=>{
  if(nearJob()) { money+=50; moneyEl.textContent=money+' QV'; say('Mission terminée : tu as gagné 50 QV.'); }
  else say('Approche-toi du bâtiment bleu pour commencer un travail.');
});
document.getElementById('interact').addEventListener('click',()=>{
  if(nearJob()) say('Bienvenue au Centre d’emploi. Appuie sur TRAVAIL pour gagner 50 QV.');
  else say('Explore le quartier et cherche le bâtiment bleu près de la route.');
});

// joystick touch + mouse fallback
const pad=document.getElementById('controls'), stick=document.getElementById('stick');
let activePointer=null;
function setStick(e) {
  const r=pad.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy;
  const max=43, len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  stick.style.left=(r.width/2-29+dx)+'px'; stick.style.top=(r.height/2-29+dy)+'px';
  moveX=dx/max; moveY=dy/max;
}
function resetStick(){ activePointer=null; moveX=0;moveY=0;stick.style.left='41px';stick.style.top='41px'; }
pad.addEventListener('pointerdown',e=>{activePointer=e.pointerId;pad.setPointerCapture(e.pointerId);setStick(e);});
pad.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)setStick(e);});
pad.addEventListener('pointerup',e=>{if(e.pointerId===activePointer)resetStick();});
pad.addEventListener('pointercancel',resetStick);

const clock=new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);
  const forward=-moveY, side=moveX;
  const len=Math.hypot(forward,side);
  if(len>.08) {
    const speed=5.2;
    player.position.x += side/Math.max(1,len)*speed*dt;
    player.position.z += -forward/Math.max(1,len)*speed*dt;
    player.position.x=THREE.MathUtils.clamp(player.position.x,-8.1,8.1);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-52,52);
    player.rotation.y=Math.atan2(side,forward);
    walking+=dt*10;
    legL.rotation.x=Math.sin(walking)*.65; legR.rotation.x=-Math.sin(walking)*.65;
    armL.rotation.x=-Math.sin(walking)*.4; armR.rotation.x=Math.sin(walking)*.4;
  } else {
    legL.rotation.x=THREE.MathUtils.damp(legL.rotation.x,0,8,dt);
    legR.rotation.x=THREE.MathUtils.damp(legR.rotation.x,0,8,dt);
    armL.rotation.x=THREE.MathUtils.damp(armL.rotation.x,0,8,dt);
    armR.rotation.x=THREE.MathUtils.damp(armR.rotation.x,0,8,dt);
  }
  const target=new THREE.Vector3(player.position.x,1.1,player.position.z);
  const desired=new THREE.Vector3(player.position.x,4.2,player.position.z+7.5);
  camera.position.lerp(desired,1-Math.exp(-4*dt));
  camera.lookAt(target);
  if(performance.now()>lastMsg) message.style.display='none';
  renderer.render(scene,camera);
}
animate();
loading.style.display='none';

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
</script>
</body>
</html>
